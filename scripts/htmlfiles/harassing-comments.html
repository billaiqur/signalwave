<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signalwave — Harassing comments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#161A2C;
    --ink-soft:#6B7086;
    --card:#FFFFFF;
    --field-bg:#F5F5F8;
    --line:#E7E7EE;
    --indigo:#5B4FD1;
    --indigo-deep:#4A3FBD;
    --indigo-wash:#F0EEFC;
    --positive:#1FA971;
    --positive-wash:#E9F8F0;
    --negative:#E0524A;
    --negative-wash:#FBEAEA;
    --neutral:#C98A1F;
    --neutral-wash:#FBF1E1;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter', sans-serif;
    background:linear-gradient(165deg, #EEF0FC 0%, #F0EBF8 35%, #F8ECEF 65%, #FCEFE9 100%);
    color:var(--ink);
    min-height:100vh;
  }
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit;}

  .topnav{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 32px;
    background:var(--card);
    border-bottom:1px solid var(--line);
  }
  .nav-left{ display:flex; align-items:center; gap:16px; }
  .burger-btn{
    width:38px; height:38px;
    display:flex; align-items:center; justify-content:center;
    border-radius:9px; border:1px solid var(--line);
    background:#fff; cursor:pointer; flex:0 0 auto;
    transition:border-color 0.15s, background 0.15s;
  }
  .burger-btn:hover{ border-color:var(--indigo); background:var(--indigo-wash); }
  .burger-btn svg{ width:17px; height:17px; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .logo-mark{
    width:32px; height:32px; border-radius:9px;
    background:linear-gradient(135deg,#5A6CE0,#C46F86);
    display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  .brand .wordmark{ font-family:'Plus Jakarta Sans', sans-serif; font-weight:700; font-size:17px; letter-spacing:-0.01em; }
  .nav-right{ display:flex; align-items:center; gap:18px; }
  select.select-pill{
    padding:9px 13px; border-radius:9px; border:1px solid var(--line);
    background:#fff; font-size:13px; font-weight:600; color:var(--ink); cursor:pointer;
  }
  .avatar{
    width:34px; height:34px; border-radius:50%;
    background:var(--indigo-wash); color:var(--indigo);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:13px; font-family:'Plus Jakarta Sans', sans-serif;
  }

  .drawer-overlay{
    position:fixed; inset:0; background:rgba(22,26,44,0.32);
    opacity:0; visibility:hidden; transition:opacity 0.2s; z-index:40;
  }
  .drawer-overlay.open{ opacity:1; visibility:visible; }
  .drawer{
    position:fixed; top:0; left:0; height:100vh; width:270px;
    background:#fff; border-right:1px solid var(--line); z-index:50;
    transform:translateX(-100%); transition:transform 0.22s ease;
    display:flex; flex-direction:column; padding:22px 18px;
  }
  .drawer.open{ transform:translateX(0); }
  .drawer-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; padding:0 4px; }
  .drawer-close{
    width:32px; height:32px; display:flex; align-items:center; justify-content:center;
    border-radius:8px; border:none; background:var(--field-bg); cursor:pointer;
  }
  .drawer-close svg{ width:14px; height:14px; }
  .drawer-nav{ display:flex; flex-direction:column; gap:4px; }
  .drawer-item{
    display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:9px;
    font-size:14px; font-weight:600; color:var(--ink-soft); cursor:pointer;
    transition:background 0.15s, color 0.15s;
  }
  .drawer-item:hover{ background:var(--field-bg); color:var(--ink); }
  .drawer-item.current{ background:var(--indigo-wash); color:var(--indigo); }
  .drawer-item .d-icon{ width:19px; height:19px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; }
  .drawer-item .d-icon svg{ width:100%; height:100%; }
  .drawer-item .alert-dot{ width:7px; height:7px; border-radius:50%; background:var(--negative); margin-left:auto; }
  .drawer-foot{ margin-top:auto; border-top:1px solid var(--line); padding-top:14px; }
  .drawer-foot .drawer-item{ color:var(--ink-soft); }

  .page{ max-width:1120px; margin:0 auto; padding:36px 24px 80px; }
  .page-head{ margin-bottom:22px; }
  .page-head h1{ font-family:'Plus Jakarta Sans', sans-serif; font-weight:800; font-size:26px; margin:0 0 4px; }
  .page-head p{ font-size:14px; color:var(--ink-soft); margin:0; }

  .stat-strip{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    margin-bottom:22px;
  }
  .strip-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 18px;
  }
  .strip-card .st-num{ font-family:'Plus Jakarta Sans', sans-serif; font-weight:800; font-size:22px; }
  .strip-card .st-label{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .strip-card.deleted .st-num{ color:var(--negative); }
  .strip-card.hidden .st-num{ color:var(--neutral); }
  .strip-card.reported .st-num{ color:var(--indigo); }

  .filter-bar{
    display:flex;
    gap:10px;
    margin-bottom:20px;
    flex-wrap:wrap;
  }
  .filter-bar select, .filter-bar input{
    padding:10px 14px;
    border-radius:9px;
    border:1px solid var(--line);
    background:#fff;
    font-size:13px;
    font-weight:500;
    color:var(--ink);
  }
  .filter-bar input{ flex:1; min-width:200px; }
  .filter-bar select{ font-weight:600; cursor:pointer; }

  .comment-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    margin-bottom:12px;
    overflow:hidden;
  }
  .comment-row{
    display:flex;
    align-items:flex-start;
    gap:14px;
    padding:16px 18px;
  }
  .comment-row .pfp{
    width:38px; height:38px; border-radius:50%;
    background:linear-gradient(135deg,#8264C9,#E68A6E);
    flex:0 0 auto;
  }
  .comment-body{ flex:1; min-width:0; }
  .comment-top{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:4px;
    flex-wrap:wrap;
  }
  .comment-top .pname{ font-size:13.5px; font-weight:700; }
  .comment-top .phandle{ font-size:12.5px; color:var(--ink-soft); }
  .comment-top .platform-chip{
    font-size:10.5px;
    font-weight:600;
    padding:2px 7px;
    border-radius:5px;
    background:var(--field-bg);
    color:var(--ink-soft);
  }
  .comment-text{
    font-size:13.5px;
    color:var(--ink);
    line-height:1.5;
    font-style:italic;
    margin-bottom:6px;
  }
  .comment-meta{
    font-size:12px;
    color:var(--ink-soft);
  }
  .comment-actions{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:8px;
    flex:0 0 auto;
  }
  .status-badge{
    font-size:11px;
    font-weight:700;
    padding:4px 10px;
    border-radius:6px;
    white-space:nowrap;
  }
  .status-badge.pending{ background:var(--field-bg); color:var(--ink-soft); }
  .status-badge.deleted{ background:var(--negative-wash); color:var(--negative); }
  .status-badge.hidden{ background:var(--neutral-wash); color:var(--neutral); }
  .status-badge.reported{ background:var(--indigo-wash); color:var(--indigo); }

  .action-btns{ display:flex; gap:6px; }
  .icon-btn{
    width:30px; height:30px;
    border-radius:7px;
    border:1px solid var(--line);
    background:#fff;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .icon-btn:hover{ border-color:var(--indigo); color:var(--indigo); }
  .icon-btn svg{ width:14px; height:14px; }

  .history-toggle{
    font-size:12px;
    font-weight:600;
    color:var(--indigo);
    cursor:pointer;
    background:none;
    border:none;
    padding:0;
  }

  .history-panel{
    display:none;
    background:var(--field-bg);
    padding:16px 18px 16px 68px;
    border-top:1px solid var(--line);
  }
  .history-panel.open{ display:block; }
  .history-item{
    display:flex;
    gap:10px;
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .history-item:last-child{ margin-bottom:0; }
  .history-item .h-dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--indigo);
    margin-top:5px;
    flex:0 0 auto;
  }
  .history-item strong{ color:var(--ink); }

  @media (max-width: 900px){
    .stat-strip{ grid-template-columns:repeat(2,1fr); }
    .comment-row{ flex-direction:column; }
    .comment-actions{ align-items:flex-start; flex-direction:row; }
    .history-panel{ padding-left:18px; }
  }
</style>
</head>
<body>

<div class="topnav">
  <div class="nav-left">
    <button class="burger-btn" onclick="openDrawer()" aria-label="Open menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18" stroke-linecap="round"/></svg>
    </button>
    <a class="brand" href="dashboard.html" title="Back to Signalwave home">
      <span class="logo-mark">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M3 15c2.2 0 3.3-7 5.5-7s3.3 7 5.5 7 3.3-7 5.5-7" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="wordmark">Signalwave</span>
    </a>
  </div>
  <div class="nav-right">
    <select class="select-pill" id="channel-select" style="display:none;" onchange="onChannelChange()">
      <option value="">All channels</option>
    </select>
    <div class="avatar" id="avatarInitials">--</div>
  </div>
</div>

<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<nav class="drawer" id="drawer">
  <div class="drawer-head">
    <a class="brand" href="dashboard.html">
      <span class="logo-mark">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M3 15c2.2 0 3.3-7 5.5-7s3.3 7 5.5 7 3.3-7 5.5-7" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="wordmark">Signalwave</span>
    </a>
    <button class="drawer-close" onclick="closeDrawer()" aria-label="Close menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="drawer-nav">
    <a class="drawer-item" href="dashboard.html" onclick="closeDrawer()">
      <span class="d-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg></span>
      Dashboard
    </a>
    <a class="drawer-item current" href="harassing-comments.html" onclick="closeDrawer()">
      <span class="d-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 4 6.5v5c0 5 3.5 7.7 8 9.5 4.5-1.8 8-4.5 8-9.5v-5L12 3z"/><path d="M12 8v4.5M12 15.2v.1" stroke-linecap="round"/></svg></span>
      Harassing comments
    </a>
    <a class="drawer-item" href="sentiment-analysis.html" onclick="closeDrawer()">
      <span class="d-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V9M10 19V5M16 19v-7M20 19v-3" stroke-linecap="round"/></svg></span>
      Sentiment Analysis
    </a>
    <a class="drawer-item" href="settings.html" onclick="closeDrawer()">
      <span class="d-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>

  <div class="drawer-foot">

      <span class="d-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" stroke-linecap="round" stroke-linejoin="round"/></svg></span>

<div class="page">

  <div class="page-head">
    <h1>Harassing comments</h1>
    <p>Comments we've flagged, hidden, or removed to keep your community safe.</p>
  </div>

  <div class="stat-strip">
    <div class="strip-card">
      <div class="st-num" id="stat-flagged">—</div>
      <div class="st-label">Total flagged</div>
    </div>
    <div class="strip-card hidden">
      <div class="st-num" id="stat-hidden">—</div>
      <div class="st-label">Hidden</div>
    </div>
    <div class="strip-card deleted">
      <div class="st-num" id="stat-reviewed">—</div>
      <div class="st-label">Reviewed</div>
    </div>
    <div class="strip-card reported">
      <div class="st-num" id="stat-flagged-users">—</div>
      <div class="st-label">Flagged users</div>
    </div>
  </div>

  <div class="filter-bar">
    <input type="text" placeholder="Search by keyword or profile">
    <select>
      <option>All platforms</option>
      <option>Instagram</option>
      <option>Facebook</option>
      <option>YouTube</option>
    </select>
    <select>
      <option>All statuses</option>
      <option>Pending review</option>
      <option>Deleted</option>
      <option>Hidden</option>
      <option>Reported</option>
    </select>
    <select>
      <option>Last 30 days</option>
      <option>Last 7 days</option>
      <option>Last 90 days</option>
      <option>All time</option>
    </select>
  </div>

  <!-- Comment cards rendered dynamically -->
  <div id="comments-list"></div>

</div>

<script>
  const API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
    ? 'http://localhost:9000'
    : 'https://signalwave-u1jg.onrender.com';

  // ── Auth guard ──────────────────────────────────────────────
  (function(){
    const params = new URLSearchParams(window.location.search);
    if (params.get('token')) localStorage.setItem('sw_token', params.get('token'));
    if (!localStorage.getItem('sw_token')) window.location.href = 'index.html';
  })();

  function authHeader(){ return { 'Authorization': 'Bearer ' + localStorage.getItem('sw_token') }; }

  function logout(){
    localStorage.removeItem('sw_token');
    window.location.href = 'index.html';
  }

  function openDrawer(){
    document.getElementById('drawer').classList.add('open');
    document.getElementById('drawerOverlay').classList.add('open');
  }
  function closeDrawer(){
    document.getElementById('drawer').classList.remove('open');
    document.getElementById('drawerOverlay').classList.remove('open');
  }
  document.addEventListener('keydown', e=>{ if(e.key === 'Escape') closeDrawer(); });

  function toggleHistory(btn){
    const panel = btn.closest('.comment-card').querySelector('.history-panel');
    const open = panel.classList.toggle('open');
    btn.textContent = open ? 'Hide history ▴' : 'View history ▾';
  }

  // ── Load user profile + populate channel dropdown ────────────
  async function loadMe(){
    try {
      const r = await fetch(`${API}/auth/me`, { headers: authHeader() });
      if (r.status === 401){ logout(); return; }
      const u = await r.json();
      const initials = (u.name || u.email || '?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
      document.getElementById('avatarInitials').textContent = initials;
    } catch(e){}
    // Load channel dropdown
    try {
      const r = await fetch(`${API}/api/channels`, { headers: authHeader() });
      if (!r.ok) return;
      const channels = await r.json();
      const sel = document.getElementById('channel-select');
      if (channels.length > 0 && sel) {
        sel.innerHTML = '<option value="">All channels</option>';
        channels.forEach(ch => {
          const platform = ch.platform ? ch.platform.charAt(0).toUpperCase() + ch.platform.slice(1).toLowerCase() : '';
          const opt = document.createElement('option');
          opt.value = ch.id;
          opt.textContent = [ch.name || ch.id, platform].filter(Boolean).join(' — ');
          sel.appendChild(opt);
        });
        sel.style.display = '';
      }
    } catch(e){}
  }

  let currentChannelId = '';

  function onChannelChange(){
    currentChannelId = document.getElementById('channel-select').value;
    loadStats();
    loadComments();
  }

  // ── Load stats ───────────────────────────────────────────────
  async function loadStats(){
    try {
      const suffix = currentChannelId ? `?channel_id=${encodeURIComponent(currentChannelId)}` : '';
      const r = await fetch(`${API}/api/stats/summary${suffix}`, { headers: authHeader() });
      if (!r.ok) return;
      const s = await r.json();
      document.getElementById('stat-flagged').textContent = s.harassing_comments ?? 0;
      document.getElementById('stat-hidden').textContent = s.hidden_comments ?? 0;
      document.getElementById('stat-reviewed').textContent = s.reviewed_comments ?? 0;
      document.getElementById('stat-flagged-users').textContent = s.flagged_users ?? 0;
    } catch(e){}
  }

  // ── Render helpers ───────────────────────────────────────────
  function scoreLabel(score){
    if (score == null) return '';
    return `toxicity score ${score.toFixed(2)}`;
  }

  function formatDate(iso){
    if (!iso) return '';
    return new Date(iso).toLocaleString('en-US', { month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit' });
  }

  function statusBadge(c){
    if (c.is_hidden) return '<span class="status-badge hidden">Hidden</span>';
    if (!c.is_reviewed) return '<span class="status-badge pending">Pending review</span>';
    return '<span class="status-badge reported">Reviewed</span>';
  }

  function platformChip(platform){
    const name = platform ? platform.charAt(0).toUpperCase() + platform.slice(1).toLowerCase() : 'Unknown';
    return `<span class="platform-chip">${name}</span>`;
  }

  function renderComment(c){
    const username = c.platform_user_name || c.platform_user_id || 'Unknown user';
    const handle = c.platform_user_name ? `@${c.platform_user_name}` : '';
    const meta = [
      c.is_hidden ? 'Hidden by Signalwave' : 'Flagged automatically',
      scoreLabel(c.harassment_score),
      formatDate(c.created_time || c.fetched_at)
    ].filter(Boolean).join(' · ');

    return `
    <div class="comment-card" data-id="${c.id}">
      <div class="comment-row">
        <div class="pfp"></div>
        <div class="comment-body">
          <div class="comment-top">
            <span class="pname">${escHtml(username)}</span>
            ${handle ? `<span class="phandle">${escHtml(handle)}</span>` : ''}
            ${platformChip(c.platform)}
          </div>
          <div class="comment-text">"${escHtml(c.message || '')}"</div>
          <div class="comment-meta">${meta}</div>
        </div>
        <div class="comment-actions">
          ${statusBadge(c)}
          ${!c.is_hidden ? `
          <div class="action-btns">
            <button class="icon-btn" title="Hide" onclick="hideComment('${c.id}', this)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/><path d="M4 4l16 16" stroke-linecap="round"/></svg>
            </button>
          </div>` : ''}
        </div>
      </div>
    </div>`;
  }

  function escHtml(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Load comments ────────────────────────────────────────────
  let allComments = [];
  let filterPlatform = '', filterStatus = '', filterSearch = '';

  async function loadComments(){
    const list = document.getElementById('comments-list');
    list.innerHTML = '<p style="color:var(--ink-soft);padding:24px 0">Loading…</p>';
    try {
      const suffix = currentChannelId ? `&channel_id=${encodeURIComponent(currentChannelId)}` : '';
      const r = await fetch(`${API}/api/comments?harassing_only=true&limit=100${suffix}`, { headers: authHeader() });
      if (r.status === 401){ logout(); return; }
      allComments = await r.json();
      renderFiltered();
    } catch(e){
      list.innerHTML = '<p style="color:var(--negative);padding:24px 0">Failed to load comments. Is the server running?</p>';
    }
  }

  function renderFiltered(){
    const list = document.getElementById('comments-list');
    let filtered = allComments;
    if (filterPlatform) filtered = filtered.filter(c => (c.platform||'').toLowerCase() === filterPlatform);
    if (filterStatus === 'hidden') filtered = filtered.filter(c => c.is_hidden);
    if (filterStatus === 'pending') filtered = filtered.filter(c => !c.is_hidden && !c.is_reviewed);
    if (filterStatus === 'reviewed') filtered = filtered.filter(c => c.is_reviewed);
    if (filterSearch) filtered = filtered.filter(c =>
      (c.message||'').toLowerCase().includes(filterSearch) ||
      (c.platform_user_name||'').toLowerCase().includes(filterSearch)
    );
    if (filtered.length === 0){
      list.innerHTML = `
        <div style="text-align:center;padding:60px 24px;color:var(--ink-soft)">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom:12px;opacity:0.4"><path d="M12 3 4 6.5v5c0 5 3.5 7.7 8 9.5 4.5-1.8 8-4.5 8-9.5v-5L12 3z"/></svg>
          <p style="font-weight:700;font-size:15px;color:var(--ink)">No harassing comments found</p>
          <p style="font-size:13px">Your channel looks clean, or no scans have run yet.</p>
        </div>`;
    } else {
      list.innerHTML = filtered.map(renderComment).join('');
    }
  }

  // ── Hide action ──────────────────────────────────────────────
  async function hideComment(id, btn){
    btn.disabled = true;
    try {
      const r = await fetch(`${API}/api/comments/${id}/hide`, { method:'POST', headers: authHeader() });
      if (r.ok){
        const c = allComments.find(x=>x.id===id);
        if (c) c.is_hidden = true;
        renderFiltered();
        loadStats();
      } else {
        btn.disabled = false;
        alert('Failed to hide comment.');
      }
    } catch(e){ btn.disabled = false; }
  }

  // ── Filter wiring ────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', ()=>{
    loadMe();
    loadStats();
    loadComments();

    document.querySelector('.filter-bar input').addEventListener('input', e=>{
      filterSearch = e.target.value.trim().toLowerCase();
      renderFiltered();
    });
    const selects = document.querySelectorAll('.filter-bar select');
    selects[0].addEventListener('change', e=>{
      filterPlatform = e.target.value.toLowerCase() === 'all platforms' ? '' : e.target.value.toLowerCase();
      renderFiltered();
    });
    selects[1].addEventListener('change', e=>{
      const v = e.target.value.toLowerCase();
      filterStatus = v === 'all statuses' ? '' : v === 'pending review' ? 'pending' : v;
      renderFiltered();
    });
  });
</script>

</body>
</html>
